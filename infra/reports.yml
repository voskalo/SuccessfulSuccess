AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Weekly meetings report system: a scheduled Lambda function (report-builder)
  queries Aurora and writes a CSV to S3. An S3 event triggers a second Lambda
  function (report-mailer) which emails the CSV via SES.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  RouteTableIds:
    Type: List<String>
    Description: Route tables for the VPC subnets, to attach the S3 endpoint to.

  FunctionSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that has database access.

  ImageUri:
    Type: String
    Description: The backend container image.

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  DbEndpoint:
    Type: String
    Description: Aurora database endpoint address.

  DbPassword:
    Type: String
    NoEcho: true

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  SenderEmail:
    Type: String
    Description: The verified SES identity (email address) used as sender and recipient.

Resources:
  # --- S3 Bucket ------------------------------------------------------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ReportMailer.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

  # --- VPC Endpoint for S3 --------------------------------------------------
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds: !Ref RouteTableIds

  # --- SQS Queues -----------------------------------------------------------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests-dlq

  ReportQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-report-requests
      VisibilityTimeout: 360 # 6 times the builder timeout (60s)
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  # --- Report Builder Lambda (in VPC) ---------------------------------------
  BuilderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: S3WriteAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7

  ReportBuilder:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Queries Aurora and writes weekly report CSV to S3
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt BuilderRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Sub
            # We assume Aurora endpoint is the same format and predictable, or we can look it up.
            # Wait, the database endpoint isn't known to this template natively.
            # But they share the same DB. We can either pass DbEndpoint as a parameter,
            # or import it if we exported it from the backend stack.
            # The backend stack doesn't Export it, but it outputs it. We will pass DbEndpoint as a parameter.
            - "postgresql+asyncpg://app:${DbPassword}@${DbEndpoint}:5432/meetings"
            - DbEndpoint: !Ref DbEndpoint
          APP_TIMEZONE: !Ref AppTimezone
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          LOG_LEVEL: INFO

  BuilderSqsEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt ReportQueue.Arn
      FunctionName: !Ref ReportBuilder
      Enabled: true

  # --- EventBridge Scheduler ------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SqsSend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportQueue.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      ScheduleExpression: "cron(0 9 ? * MON *)"
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source": "schedule", "week": null}'

  # --- Report Mailer Lambda (outside VPC) -----------------------------------
  MailerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3AndSesAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: "*"

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7

  ReportMailer:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Sends the weekly report CSV via SES
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      MemorySize: 128
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from email.message import EmailMessage
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")

          def handler(event, context):
              logger.info("report-mailer triggered by s3")

              record = event["Records"][0]
              bucket = record["s3"]["bucket"]["name"]
              key = record["s3"]["object"]["key"]

              # Download CSV
              response = s3.get_object(Bucket=bucket, Key=key)
              csv_data = response["Body"].read()

              # Build email
              sender = os.environ["SENDER_EMAIL"]
              msg = EmailMessage()
              msg["Subject"] = "Weekly Meetings Report"
              msg["From"] = sender
              msg["To"] = sender
              msg.set_content("Please find the weekly meetings report attached.")

              msg.add_attachment(
                  csv_data,
                  maintype="text",
                  subtype="csv",
                  filename=key.split("/")[-1]
              )

              # Send email
              ses.send_email(
                  FromEmailAddress=sender,
                  Destination={"ToAddresses": [sender]},
                  Content={"Raw": {"Data": msg.as_bytes()}}
              )

              return {"status": "sent", "key": key}

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReportMailer.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

Outputs:
  ReportQueueUrl:
    Value: !Ref ReportQueue
  ReportsBucketName:
    Value: !Ref ReportsBucket
